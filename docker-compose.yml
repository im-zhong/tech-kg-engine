services:
  neo4j:
    image: neo4j:5
    container_name: tech-kg-neo4j
    ports:
      - "7474:7474"   # HTTP Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  graph-db-api:
    build: .
    container_name: tech-kg-graph-db-api
    ports:
      - "8000:8000"
    environment:
      GRAPH_DB_BACKEND: neo4j
      GRAPH_DB_URI: bolt://neo4j:7687
      GRAPH_DB_USERNAME: neo4j
      GRAPH_DB_PASSWORD: ${NEO4J_PASSWORD}
      GRAPH_DB_DATABASE: neo4j
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./graph_db:/app/graph_db
      - ./graph_db.egg-info:/app/graph_db.egg-info
      - ./pyproject.toml:/app/pyproject.toml
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
